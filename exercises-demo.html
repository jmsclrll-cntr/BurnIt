<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercises the System Can Detect</title>

  <!-- Google Fonts: Space Grotesk & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Space+Grotesk:wght@300;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #0e0f14;
      --text-heading: #ffffff;
      --text-muted: #9aa1b2;
      --border-tabs: #2a2f3d;
      --accent-orange: #f97316;
      --overlay-orange: #ea580c;
      --video-bg: #000000;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      font-family: var(--font-body);
      color: var(--text-heading);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Centered Container Column */
    .demo-section {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    .header-group {
      text-align: center;
    }

    .heading {
      font-family: var(--font-heading);
      font-size: 40px;
      font-weight: 300;
      color: var(--text-heading);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .heading .bold-text {
      font-weight: 500;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 480px;
      margin: 12px auto 0;
      line-height: 1.5;
    }

    /* Tabs (Underline Style) */
    .tabs-wrapper {
      margin-top: 36px;
      border-bottom: 1px solid var(--border-tabs);
      position: relative;
    }

    .tabs-list {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .tab-btn {
      position: relative;
      background: transparent;
      border: none;
      padding: 10px 4px 14px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s ease;
      white-space: nowrap;
      outline: none;
    }

    .tab-btn:hover {
      color: var(--text-heading);
    }

    /* Active Tab */
    .tab-btn[aria-selected="true"] {
      color: var(--text-heading);
      font-weight: 600;
    }

    .tab-btn[aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background-color: var(--accent-orange);
      border-radius: 2px 2px 0 0;
    }

    /* Focus Ring in Accent Color */
    .tab-btn:focus-visible {
      outline: 2px solid var(--accent-orange);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* Video Frame */
    .video-frame {
      margin-top: 32px;
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background-color: var(--video-bg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .video-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: var(--video-bg);
    }

    /* Overlay Column */
    .video-overlay {
      position: absolute;
      width: 27%;
      min-width: 150px;
      left: 16px;
      z-index: 2;
      pointer-events: none;
      opacity: 1;
      transition: opacity 200ms ease-in-out;
    }

    .video-overlay.pos-top {
      top: 16px;
      bottom: auto;
    }

    .video-overlay.pos-bottom {
      bottom: 16px;
      top: auto;
    }

    .overlay-title {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 600;
      color: var(--overlay-orange);
      line-height: 1.25;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .overlay-desc {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--overlay-orange);
      line-height: 1.5;
    }

    /* Mobile Breakpoint at 600px */
    @media (max-width: 600px) {
      .demo-section {
        padding: 30px 16px;
      }

      .heading {
        font-size: 28px;
      }

      .subtitle {
        font-size: 13px;
      }

      .tabs-wrapper {
        margin-top: 28px;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .tabs-wrapper::-webkit-scrollbar {
        display: none;
      }

      .tabs-list {
        gap: 18px;
        justify-content: flex-start;
        padding: 0 4px;
      }

      .tab-btn {
        font-size: 13.5px;
        padding: 8px 2px 12px;
      }

      .video-frame {
        margin-top: 24px;
      }

      .video-overlay {
        width: 46%;
        left: 12px;
      }

      .video-overlay.pos-top {
        top: 12px;
      }

      .video-overlay.pos-bottom {
        bottom: 12px;
      }

      .overlay-title {
        font-size: 18px;
        margin-bottom: 4px;
      }

      .overlay-desc {
        font-size: 12px;
        line-height: 1.45;
      }
    }

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .video-overlay,
      .tab-btn {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <main class="demo-section">
    <!-- Header -->
    <header class="header-group">
      <h1 class="heading">
        Exercises the System <span class="bold-text">Can Detect</span>
      </h1>
      <p class="subtitle">
        Real-time 33-point pose estimation, joint angle measurement, and automated rep counting for supported workouts.
      </p>
    </header>

    <!-- Tabs List -->
    <nav class="tabs-wrapper" aria-label="Exercises">
      <div class="tabs-list" role="tablist" id="exercise-tablist">
        <!-- Generated dynamically from exercises array -->
      </div>
    </nav>

    <!-- Video Showcase Frame -->
    <section class="video-frame" id="exercise-panel" role="tabpanel" aria-live="polite">
      <video
        id="exercise-video"
        class="video-element"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>

      <!-- Overlay Text Column -->
      <div id="video-overlay" class="video-overlay pos-top" aria-atomic="true">
        <h2 id="overlay-title" class="overlay-title"></h2>
        <p id="overlay-desc" class="overlay-desc"></p>
      </div>
    </section>
  </main>

  <script>
    /* ========================================================= */
    /* DATA-DRIVEN EXERCISES ARRAY                               */
    /* ========================================================= */
    const exercises = [
      {
        name: 'Squat',
        video: 'videos/squat.mp4',
        desc: 'Real-time knee and hip angle tracking, squat depth verification, and knee alignment feedback.',
        pos: 'top',
        focus: 'center 40%'
      },
      {
        name: 'Push-Up',
        video: 'videos/pushup.mp4',
        desc: 'Real-time elbow extension measurement, chest-to-floor depth verification, and full-body plank alignment.',
        pos: 'top',
        focus: 'center 50%'
      },
      {
        name: 'Plank',
        video: 'videos/plank.mp4',
        desc: 'Real-time shoulder, hip, and ankle linear posture tracking with automatic hold-time calculation.',
        pos: 'bottom',
        focus: 'center 60%'
      },
      {
        name: 'Jumping Jack',
        video: 'videos/jumping.mp4',
        desc: 'Real-time overhead arm abduction and leg spread cadence tracking for synchronized rep validation.',
        pos: 'top',
        focus: 'center 40%'
      },
      {
        name: 'Bicep Curl',
        video: 'videos/curl.mp4',
        desc: 'Real-time bilateral elbow flexion tracking with full range-of-motion validation and curl form checks.',
        pos: 'bottom',
        focus: 'center 45%'
      }
    ];

    /* ========================================================= */
    /* STATE & DOM REFERENCES                                    */
    /* ========================================================= */
    let currentIndex = 1; // Requirement: Start on the second tab (Push-Up)
    let isTransitioning = false; // Requirement: Ignore rapid clicks during fade

    const tabListEl = document.getElementById('exercise-tablist');
    const panelEl = document.getElementById('exercise-panel');
    const videoEl = document.getElementById('exercise-video');
    const overlayEl = document.getElementById('video-overlay');
    const titleEl = document.getElementById('overlay-title');
    const descEl = document.getElementById('overlay-desc');

    const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const FADE_DURATION_MS = reducedMotionQuery.matches ? 0 : 200;

    /* ========================================================= */
    /* INITIALIZE TABS & ACCESSIBILITY                           */
    /* ========================================================= */
    function buildTabs() {
      tabListEl.innerHTML = '';

      exercises.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn';
        btn.id = `tab-${index}`;
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-controls', 'exercise-panel');
        btn.textContent = item.name;

        const isSelected = index === currentIndex;
        btn.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        btn.tabIndex = isSelected ? 0 : -1;

        // Click handler
        btn.addEventListener('click', () => {
          if (index !== currentIndex) {
            selectTab(index);
          }
        });

        // Keyboard arrow navigation
        btn.addEventListener('keydown', (e) => handleKeyNavigation(e, index));

        tabListEl.appendChild(btn);
      });
    }

    /* ========================================================= */
    /* ARROW-KEY NAVIGATION (WAI-ARIA TABS PATTERN)              */
    /* ========================================================= */
    function handleKeyNavigation(e, index) {
      let targetIndex = null;
      const count = exercises.length;

      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
          e.preventDefault();
          targetIndex = (index + 1) % count;
          break;
        case 'ArrowLeft':
        case 'ArrowUp':
          e.preventDefault();
          targetIndex = (index - 1 + count) % count;
          break;
        case 'Home':
          e.preventDefault();
          targetIndex = 0;
          break;
        case 'End':
          e.preventDefault();
          targetIndex = count - 1;
          break;
        default:
          return;
      }

      if (targetIndex !== null) {
        const targetBtn = document.getElementById(`tab-${targetIndex}`);
        if (targetBtn) {
          targetBtn.focus();
          selectTab(targetIndex);
        }
      }
    }

    /* ========================================================= */
    /* SWITCH TAB LOGIC WITH FADE TRANSITION                     */
    /* ========================================================= */
    function selectTab(newIndex) {
      // Ignore rapid clicks during fade
      if (isTransitioning) return;

      const previousIndex = currentIndex;
      currentIndex = newIndex;
      isTransitioning = true;

      // Update Tab ARIA states
      const allTabs = tabListEl.querySelectorAll('.tab-btn');
      allTabs.forEach((tab, idx) => {
        const isSelected = idx === currentIndex;
        tab.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        tab.tabIndex = isSelected ? 0 : -1;
      });

      panelEl.setAttribute('aria-labelledby', `tab-${currentIndex}`);

      const nextExercise = exercises[currentIndex];
      const duration = reducedMotionQuery.matches ? 0 : FADE_DURATION_MS;

      // 1. Fade out overlay for 200ms
      overlayEl.style.opacity = '0';

      setTimeout(() => {
        // 2. Update Content while hidden
        titleEl.textContent = nextExercise.name;
        descEl.textContent = nextExercise.desc;

        // Position class ('top' | 'bottom')
        overlayEl.classList.remove('pos-top', 'pos-bottom');
        overlayEl.classList.add(nextExercise.pos === 'bottom' ? 'pos-bottom' : 'pos-top');

        // Update Video source & focus
        videoEl.style.objectPosition = nextExercise.focus || 'center center';
        videoEl.src = nextExercise.video;

        const playPromise = videoEl.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Autoplay gracefully handled if muted permissions restrict
          });
        }

        // 3. Fade back in
        setTimeout(() => {
          overlayEl.style.opacity = '1';

          // Reset transition lock once fade-in finishes
          setTimeout(() => {
            isTransitioning = false;
          }, duration);
        }, 30);

      }, duration);
    }

    /* ========================================================= */
    /* INITIAL PAGE LOAD                                         */
    /* ========================================================= */
    buildTabs();

    // Initialize content directly for starting tab without fade delay
    const initialExercise = exercises[currentIndex];
    titleEl.textContent = initialExercise.name;
    descEl.textContent = initialExercise.desc;
    overlayEl.classList.remove('pos-top', 'pos-bottom');
    overlayEl.classList.add(initialExercise.pos === 'bottom' ? 'pos-bottom' : 'pos-top');
    videoEl.style.objectPosition = initialExercise.focus || 'center center';
    videoEl.src = initialExercise.video;
    panelEl.setAttribute('aria-labelledby', `tab-${currentIndex}`);

    const playPromise = videoEl.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {});
    }
  </script>
</body>
</html>
